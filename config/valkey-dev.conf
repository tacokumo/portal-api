# Valkey開発用設定ファイル
# 開発環境向けの緩い設定（本番環境では使用しないでください）

# 基本設定
port 6379
bind 0.0.0.0
protected-mode no

# パスワード設定なし（開発用）
# requirepass your-password

# データベース数
databases 16

# 永続化設定
save 900 1
save 300 10
save 60 10000

# AOF有効化
appendonly yes
appendfsync everysec

# ログレベル
loglevel notice

# メモリ制限（開発用）
maxmemory 256mb
maxmemory-policy allkeys-lru

# 開発用設定
timeout 0
tcp-keepalive 300