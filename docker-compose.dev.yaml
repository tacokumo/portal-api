version: '3.8'

# 開発環境用Docker Composeオーバーライド
# デバッグ機能を有効にします
services:
  portal-api:
    # 開発用設定のオーバーライド
    image: golang:1.26
    working_dir: /src
    volumes:
      # ソースコードをマウント
      - .:/src
      # Go モジュールキャッシュ
      - go_mod_cache:/go/pkg/mod
      # 開発用ログ出力を見やすくするためのマウント
      - ./logs:/logs
    environment:
      # 開発用ログレベル
      - LOG_LEVEL=debug
      # CORS設定を緩和
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8080,http://localhost:*
    # 開発用コマンド
    command: >
      sh -c "
        go mod download &&
        go run ./cmd/server
      "
    # 開発用ポート追加（デバッガー用など）
    ports:
      - "8080:8080"
      - "2345:2345"  # Delve debugger port

  valkey:
    # 開発用Valkey設定
    volumes:
      - valkey_dev_data:/data
      # 開発用設定ファイル
      - ./config/valkey-dev.conf:/usr/local/etc/valkey/valkey.conf:ro
    command: >
      valkey-server /usr/local/etc/valkey/valkey.conf
      --loglevel notice

volumes:
  valkey_dev_data:
    driver: local
  go_mod_cache:
    driver: local