version: '3.8'

services:
  # Portal API メインアプリケーション
  portal-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - LOG_LEVEL=info
      - PORTAL_NAME=TACOKUMO Portal (Local)
      - VALKEY_ADDRESS=valkey:6379
      - VALKEY_PASSWORD=
      - VALKEY_DB=0
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8080
      # GitHub OAuth設定（.envから読み込み）
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_OAUTH_REDIRECT_URL=${GITHUB_OAUTH_REDIRECT_URL:-http://localhost:8080/auth/github/callback}
      # GitHub App設定
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_APP_PRIVATE_KEY_PATH=/etc/secrets/github-app-private-key.pem
      # JWT設定
      - JWT_PRIVATE_KEY_PATH=/etc/secrets/jwt-private-key.pem
      - JWT_PUBLIC_KEY_PATH=/etc/secrets/jwt-public-key.pem
      - JWT_ACCESS_TOKEN_DURATION=1h
      - JWT_REFRESH_TOKEN_DURATION=8h
    volumes:
      # JWT鍵とGitHub App秘密鍵用のマウント
      - ./secrets:/etc/secrets:ro
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - portal-network
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Valkey (Redis互換) セッション管理用
  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: portal-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    networks:
      - portal-network
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      valkey-server
      --appendonly yes
      --appendfsync everysec

volumes:
  valkey_data:
    driver: local

networks:
  portal-network:
    driver: bridge