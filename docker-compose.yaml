services:
  portal-api:
    image: golang:1.26
    container_name: portal-api
    restart: unless-stopped
    working_dir: /src
    ports:
      - "8080:8080"
      - "2345:2345"
    environment:
      - SERVER_PORT=8080
      - LOG_LEVEL=debug
      - PORTAL_NAME=TACOKUMO Portal (Local)
      - VALKEY_ADDRESS=valkey:6379
      - VALKEY_PASSWORD=
      - VALKEY_DB=0
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8080,http://localhost:*
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_OAUTH_REDIRECT_URL=${GITHUB_OAUTH_REDIRECT_URL:-http://localhost:8080/auth/github/callback}
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_APP_PRIVATE_KEY_PATH=/etc/secrets/github-app-private-key.pem
      - JWT_PRIVATE_KEY_PATH=/etc/secrets/jwt-private-key.pem
      - JWT_PUBLIC_KEY_PATH=/etc/secrets/jwt-public-key.pem
      - JWT_ACCESS_TOKEN_DURATION=1h
      - JWT_REFRESH_TOKEN_DURATION=8h
      - RATE_LIMIT_IP_RATE=120
      - RATE_LIMIT_IP_BURST=100
      - RATE_LIMIT_USER_RATE=300
      - RATE_LIMIT_USER_BURST=60
      - RATE_LIMIT_PERIOD_SECONDS=60
      - RATE_LIMIT_FAIL_OPEN=true
    volumes:
      - .:/src
      - go_mod_cache:/go/pkg/mod
      - ./secrets:/etc/secrets:ro
    command: >
      sh -c "
        go mod download &&
        go run ./cmd/server
      "
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - portal-network
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: portal-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
      - ./config/valkey-dev.conf:/usr/local/etc/valkey/valkey.conf:ro
    networks:
      - portal-network
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      valkey-server /usr/local/etc/valkey/valkey.conf
      --loglevel notice

volumes:
  valkey_data:
    driver: local
  go_mod_cache:
    driver: local

networks:
  portal-network:
    driver: bridge
