desc: "Application APIのバリデーションが正しく機能すること"
runners:
  req:
    endpoint: http://localhost:8080
steps:
  invalid_bearer_returns_non_200:
    desc: "不正なBearerトークンでの作成リクエストは成功しないこと"
    req:
      /v1alpha1/applications:
        post:
          header:
            Authorization: "Bearer invalid-token"
            Content-Type: "application/json"
          body:
            application/json:
              name: ""
              repository_url: "https://github.com/tacokumo/test.git"
              appconfig_path: "apps/test"
              appconfig_branch: "main"
    test: |
      current.res.status != 200 && current.res.status != 201
