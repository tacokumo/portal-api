desc: "Secret削除APIが正しく機能すること"
runners:
  req:
    endpoint: http://localhost:8080
steps:
  invalid_bearer_delete_returns_non_200:
    desc: "不正なBearerトークンでのSecret削除リクエストは成功しないこと"
    req:
      /v1alpha1/applications/nonexistent-app/secret:
        delete:
          header:
            Authorization: "Bearer invalid-token"
    test: |
      current.res.status != 200 && current.res.status != 204
