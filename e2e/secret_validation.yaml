desc: "Secret APIのバリデーションが正しく機能すること"
runners:
  req:
    endpoint: http://localhost:8080
steps:
  invalid_bearer_create_returns_non_200:
    desc: "不正なBearerトークンでのSecret作成リクエストは成功しないこと"
    req:
      /v1alpha1/applications/test-app/secret:
        post:
          header:
            Authorization: "Bearer invalid-token"
            Content-Type: "application/json"
          body:
            application/json:
              items:
                - key: "invalid/key"
                  value: "some-value"
    test: |
      current.res.status != 200 && current.res.status != 201
  invalid_bearer_update_returns_non_200:
    desc: "不正なBearerトークンでのSecret更新リクエストは成功しないこと"
    req:
      /v1alpha1/applications/test-app/secret:
        put:
          header:
            Authorization: "Bearer invalid-token"
            Content-Type: "application/json"
          body:
            application/json:
              items:
                - key: "key with spaces"
                  value: "some-value"
    test: |
      current.res.status != 200
